user nginx;
worker_processes auto;
pid /run/nginx/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    server {
        listen 80;
        server_name _;
        root /app/dist;
        index index.html;

        # Asigură că redirect-urile Nginx păstrează portul și hostul clientului (ex: :8080 sau IP LAN)
        absolute_redirect off;
        port_in_redirect off;

        location / {
            try_files $uri $uri/ $uri/index.html /index.html;
        }

        # Fisiere cu hash in nume (build Astro): cache lung, imutabile
        location /_astro/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable, no-transform";
        }

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 7d;
            add_header Cache-Control "public, no-transform";
        }
    }
}
